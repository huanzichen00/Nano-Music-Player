[package]
name = "nano-music-player"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "An iPod nano inspired desktop music player with centralized keyboard interaction"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "accessibility", "compat-1-18", "unstable-winit-030"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
rfd = "0.15.4"
lofty = "0.22.4"
rusqlite = { version = "0.37", features = ["bundled"] }
directories = "6"
walkdir = "2"
notify = { version = "8.2", features = ["macos_kqueue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
lrc = "=0.2.0"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
libloading = "0.8.9"

[target.'cfg(target_os = "macos")'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["renderer-skia"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
tempfile = "3"
slint = { version = "=1.18.1", features = ["renderer-software"] }
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
