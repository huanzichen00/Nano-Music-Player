[package]
name = "nano-music-player"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
description = "An iPod nano inspired desktop music player with centralized keyboard interaction"

[features]
# Run the iOS interface on a desktop for development. iOS targets select it automatically.
mobile = []

# Full-library sync verifies gigabytes of audio even in device Debug builds.
[profile.dev.package.sha2]
opt-level = 3

[[example]]
name = "ios-transfer"
path = "examples/ios_transfer.rs"
required-features = ["mobile"]

[[example]]
name = "desktop-sync"
path = "examples/desktop_sync.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "accessibility", "compat-1-18", "unstable-winit-030"] }
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-all"] }
lofty = "0.22.4"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
lrc = "=0.2.0"
encoding_rs = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
unicode-normalization = "0.1"
sha2 = "0.10"
libc = "0.2"

[target.'cfg(not(target_os = "ios"))'.dependencies]
# GUI apps do not inherit shell proxy variables; respect existing OS proxy settings.
reqwest = { version = "0.12", default-features = false, features = ["system-proxy"] }
rss = { version = "2", default-features = false }
html-escape = "0.2"
slint = { version = "=1.18.1", default-features = false, features = ["renderer-femtovg"] }
rfd = "0.15.4"
directories = "6"
libloading = "0.8.9"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["renderer-skia"] }

[build-dependencies]
slint-build = "=1.18.1"
cc = "1"

[dev-dependencies]
tempfile = "3"
slint = { version = "=1.18.1", features = ["renderer-software"] }
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }

# Backport the upstream iPhone background/glyph-atlas fix to our pinned Slint.
[patch.crates-io]
i-slint-backend-winit = { path = "vendor/i-slint-backend-winit" }
i-slint-renderer-skia = { path = "vendor/i-slint-renderer-skia" }
